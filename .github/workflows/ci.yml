name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install validators
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck

      - name: Validate manifest and entry points
        run: |
          jq -e . manifest.json >/dev/null
          jq -r '.entryPoints[]' manifest.json | while IFS= read -r path; do test -f "$path"; done
          test "$(jq -r .id manifest.json)" = "io.github.mahype.omarchy-lightsync-hue"

      - name: Test
        run: node --test tests/

      - name: Check stream helper
        run: |
          bash -n tools/hue-stream.sh
          shellcheck tools/hue-stream.sh

      - name: Check certificate bundle
        run: cmp certs/hue-ca-bundle.pem <(cat certs/hue-root-bridge.pem certs/hue-root-ca-01.pem)
