name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libadwaita-1-dev libgtk-4-dev libpipewire-0.3-dev libsecret-1-dev libssl-dev pkg-config

      - name: Fetch locked dependencies
        run: cargo fetch --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --frozen --workspace --all-targets --all-features -- -D warnings

      - name: Test CLI status contract
        run: cargo test --frozen -p lightsync-cli status_json

      - name: Test
        run: cargo test --frozen --workspace --all-features

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install metadata validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils jq libxml2-utils shellcheck

      - name: Validate JSON and plugin entry points
        run: |
          jq -e . manifest.json >/dev/null
          jq -r '.entryPoints[]' manifest.json | while IFS= read -r path; do test -f "$path"; done
          test "$(jq -r .id manifest.json)" = "io.github.mahype.omarchy-lightsync"

      - name: Test Omarchy status model
        run: node --test integrations/omarchy/tests

      - name: Validate shell and packaging files
        run: |
          bash -n install.sh test-install.sh packaging/arch/PKGBUILD
          shellcheck install.sh test-install.sh packaging/arch/PKGBUILD
          test -f Cargo.lock
          grep -Fq 'cargo fetch --locked' packaging/arch/PKGBUILD
          grep -Fq 'cargo build --frozen' packaging/arch/PKGBUILD
          ! grep -Fq "sha256sums=('SKIP')" packaging/arch/PKGBUILD
          checksum=$(printf '%064d' 0)
          LIGHTSYNC_V0_1_0_SHA256="$checksum" bash -c 'source packaging/arch/PKGBUILD; test "${#sha256sums[0]}" -eq 64'

      - name: Test source install and removal sandbox
        run: ./test-install.sh

      - name: Validate desktop metadata
        run: |
          desktop-file-validate data/io.github.mahype.omarchylightsync.desktop
          appstreamcli validate --pedantic --no-net data/io.github.mahype.omarchylightsync.metainfo.xml
          xmllint --noout data/io.github.mahype.omarchylightsync.metainfo.xml data/icons/hicolor/scalable/apps/io.github.mahype.omarchylightsync.svg
          test "$(grep -Fxc 'Icon=io.github.mahype.omarchylightsync' data/io.github.mahype.omarchylightsync.desktop)" -eq 1
          test "$(grep -Fxc 'StartupWMClass=io.github.mahype.omarchylightsync' data/io.github.mahype.omarchylightsync.desktop)" -eq 1
          test "$(xmllint --xpath 'string(/component/id)' data/io.github.mahype.omarchylightsync.metainfo.xml)" = 'io.github.mahype.omarchylightsync'
          test "$(xmllint --xpath 'string(/component/launchable)' data/io.github.mahype.omarchylightsync.metainfo.xml)" = 'io.github.mahype.omarchylightsync.desktop'
          test -f data/icons/hicolor/scalable/apps/io.github.mahype.omarchylightsync.svg

      - name: Validate with Omarchy when available
        run: |
          if command -v omarchy-plugin-validate >/dev/null 2>&1; then
            omarchy plugin validate .
          else
            echo "omarchy plugin validator is not installed on this runner"
          fi
