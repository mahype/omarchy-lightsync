[workspace]
members = [
    "crates/lightsync-domain",
    "crates/lightsync-engine",
    "crates/lightsync-hue",
    "crates/lightsync-capture",
    "crates/lightsync-ipc",
    "crates/lightsync-daemon",
    "crates/lightsync-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Sven Wagener"]
repository = "https://github.com/mahype/omarchy-lightsync"

[workspace.dependencies]
anyhow = "1"
ashpd = { version = "0.12.3", default-features = false, features = ["tokio"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
hex = "0.4"
keyring = { version = "3.6", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }
mdns-sd = "0.17"
native-tls = "0.2"
openssl = "0.10"
pipewire = "0.10.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-journald = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
